# Render blueprint (free web service). Secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: cadral-ops-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL        # free Postgres from Neon/Supabase so data survives restarts
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AGENT_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: REPORT_RECIPIENTS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RAG_BACKEND         # "lite" keeps memory under Render's 512 MB; use "auto" on bigger hosts
        value: lite
