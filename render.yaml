# Render blueprint for a free demo instance (New -> Blueprint -> pick this repository).
# The three "sync: false" values are typed into the Render dashboard when the blueprint is created - never committed.
services:
  - type: web
    name: cadral-ops-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY          # free key from console.groq.com/keys
        sync: false
      - key: ADMIN_PASSWORD       # dashboard password for admin@demo.co.uk
        sync: false
      - key: AGENT_PASSWORD       # dashboard password for agent@demo.co.uk
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAG_BACKEND          # "lite" keeps memory inside the free plan's 512 MB (no ONNX models)
        value: lite
      - key: DEMO_SEED_ON_BOOT    # the free plan's disk is wiped on every restart, so sample traffic is reloaded on boot
        value: "true"
      - key: ALLOW_EVAL_RUN       # the eval suite needs a second Python process - too much for 512 MB
        value: "false"

# Optional, add in the Render dashboard when needed: SLACK_WEBHOOK_URL, TELEGRAM_BOT_TOKEN + TELEGRAM_WEBHOOK_SECRET,
# and DATABASE_URL (a free Neon Postgres) if conversations must survive restarts.
# Render's free plan blocks outbound SMTP, so the email channel and the emailed daily report need a paid plan there.
